# Deploy to Vercel on push — no GitHub App on the org required.
#
# One-time (whoever has Vercel + repo admin):
#   1. npm i -g vercel && cd repo && vercel login && vercel link
#   2. From .vercel/project.json copy orgId → VERCEL_ORG_ID, projectId → VERCEL_PROJECT_ID
#      (Or Vercel → Project → Settings → General.)
#   3. Vercel → Account Settings → Tokens → Create → VERCEL_TOKEN
#   4. GitHub → repo → Settings → Secrets and variables → Actions → New repository secret (all three)

name: Deploy to Vercel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing Actions secrets. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod --yes

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --yes
