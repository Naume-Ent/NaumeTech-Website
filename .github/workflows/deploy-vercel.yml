# Deploy to Vercel on every push — works without the Vercel GitHub App on your org.
# Setup (one time):
#  1. Install Vercel CLI locally: npm i -g vercel
#  2. In this repo folder: vercel login && vercel link  (create/link a Vercel project)
#  3. Open .vercel/project.json — copy orgId → VERCEL_ORG_ID, projectId → VERCEL_PROJECT_ID
#  4. Vercel dashboard → Settings → Tokens → create token → VERCEL_TOKEN
#  5. GitHub repo → Settings → Secrets and variables → Actions → add the three secrets above

name: Deploy to Vercel

on:
  push:
    branches: [main, master]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
